<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FOODING CLUB · PTCI</title>
  <style>
    :root{
      --bg:#f8f1fb;
      --bg-2:#fff9fd;
      --surface:#fffdfd;
      --surface-soft:#fcf7ff;
      --ink:#342343;
      --muted:#806f8e;
      --muted-2:#a99ab4;
      --line:#eadcf0;
      --line-strong:#d8bfe2;
      --purple:#8755b0;
      --purple-dark:#6d3e8d;
      --purple-soft:#eee0f6;
      --pink:#f3dfe9;
      --gold:#cf9b42;
      --shadow:0 14px 40px rgba(94,55,122,.08);
      --radius:24px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;min-width:320px;background:linear-gradient(145deg,var(--bg) 0%,#fbf7fb 44%,#f7edf7 100%);color:var(--ink);font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;line-height:1.5}
    button{font:inherit;color:inherit;border:0;cursor:pointer}
    button:focus-visible,a:focus-visible{outline:3px solid #b586d0;outline-offset:3px}
    .site-shell{min-height:100vh}
    .site-header{position:sticky;top:0;z-index:20;height:70px;border-bottom:1px solid rgba(234,220,240,.9);background:rgba(255,253,253,.84);backdrop-filter:blur(16px)}
    .header-inner{width:min(1120px,calc(100% - 36px));height:100%;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px}
    .brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap;text-decoration:none;color:var(--ink)}
    .brand-main{font-weight:900;letter-spacing:.06em;font-size:17px}
    .brand-sub{font-size:11px;font-weight:700;letter-spacing:.13em;color:var(--purple)}
    .header-actions{display:flex;align-items:center;gap:10px}
    .nav-btn,.reset-btn{background:transparent;color:var(--muted);font-size:13px;font-weight:700;padding:9px 10px;border-radius:10px}
    .nav-btn:hover,.reset-btn:hover{background:var(--purple-soft);color:var(--purple-dark)}
    .reset-btn{border:1px solid var(--line);color:var(--purple-dark);background:var(--surface)}
    .page{width:min(1120px,calc(100% - 36px));margin:0 auto;padding:54px 0 92px}
    .hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr);gap:30px;align-items:stretch}
    .eyebrow{font-size:13px;letter-spacing:.16em;color:var(--purple);font-weight:900;text-transform:uppercase}
    h1,h2,h3,p{margin:0}
    h1{font-size:clamp(34px,5.2vw,64px);line-height:1.1;letter-spacing:-.055em;margin-top:18px;max-width:640px}
    .hero-copy{font-size:18px;color:var(--muted);margin-top:21px;max-width:590px}
    .hero-actions{display:flex;flex-wrap:wrap;gap:11px;margin-top:30px}
    .primary-btn,.secondary-btn{min-height:48px;padding:0 20px;border-radius:14px;font-weight:900;transition:transform .18s ease,box-shadow .18s ease,background .18s ease}
    .primary-btn{background:var(--purple);color:#fff;box-shadow:0 10px 24px rgba(135,85,176,.24)}
    .secondary-btn{background:var(--surface);border:1px solid var(--line-strong);color:var(--purple-dark)}
    .primary-btn:hover,.secondary-btn:hover{transform:translateY(-2px)}
    .hero-panel{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:30px;background:linear-gradient(150deg,#7b489b,#a16ec0);color:#fff;min-height:310px;padding:30px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow)}
    .hero-panel:before,.hero-panel:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.24);border-radius:50%;width:180px;height:180px;right:-70px;top:-74px}
    .hero-panel:after{width:290px;height:290px;right:-126px;top:-126px}
    .home-mascot{position:absolute;right:14px;bottom:14px;width:148px;aspect-ratio:1;z-index:1;display:block;object-fit:cover;border-radius:26px;filter:drop-shadow(0 10px 12px rgba(43,20,61,.18))}
    .panel-label,.panel-title,.panel-copy,.panel-stat{position:relative;z-index:1}
    .panel-label{font-size:12px;letter-spacing:.16em;font-weight:900;opacity:.75}
    .panel-title{font-size:clamp(30px,4vw,48px);font-weight:900;letter-spacing:-.06em;line-height:1.03;margin-top:22px}
    .panel-copy{margin-top:15px;color:rgba(255,255,255,.78);font-size:14px;max-width:290px}
    .panel-stat{display:flex;align-items:flex-end;justify-content:space-between;margin-top:22px}
    .panel-stat strong{font-size:44px;line-height:1;font-weight:900;letter-spacing:-.05em}
    .panel-stat span{font-size:12px;color:rgba(255,255,255,.73);padding-bottom:3px}
    .section{margin-top:70px}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px}
    .section-kicker{font-size:12px;font-weight:900;letter-spacing:.13em;color:var(--purple);text-transform:uppercase}
    .section-title{font-size:clamp(24px,3vw,34px);letter-spacing:-.055em;line-height:1.15;margin-top:7px}
    .section-note{font-size:13px;color:var(--muted);max-width:410px;text-align:right}
    .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
    .metric{background:rgba(255,253,253,.9);border:1px solid var(--line);border-radius:19px;padding:21px 22px;box-shadow:0 7px 24px rgba(94,55,122,.04)}
    .metric-value{display:block;font-weight:900;font-size:30px;letter-spacing:-.06em;line-height:1.1}
    .metric-label{display:block;margin-top:8px;font-size:13px;color:var(--muted)}
    .feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    .feature-card{min-height:196px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 7px 24px rgba(94,55,122,.04);text-align:left}
    .feature-card:hover{border-color:#c8a5d7;transform:translateY(-2px);box-shadow:var(--shadow)}
    .feature-card.accent{background:linear-gradient(145deg,#7b489b,#9d65bb);border-color:transparent;color:#fff}
    .feature-label{font-size:11px;letter-spacing:.1em;font-weight:900;color:var(--purple)}
    .accent .feature-label{color:rgba(255,255,255,.75)}
    .feature-title{font-size:22px;letter-spacing:-.045em;font-weight:900;margin-top:11px}
    .feature-copy{font-size:14px;color:var(--muted);margin-top:7px}
    .accent .feature-copy{color:rgba(255,255,255,.78)}
    .feature-link{font-size:13px;font-weight:900;color:var(--purple-dark);margin-top:20px}
    .accent .feature-link{color:#fff}
    .catalog-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
    .type-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:13px;overflow:hidden;text-align:center;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
    .type-card:hover{transform:translateY(-3px);border-color:#c19bd1;box-shadow:var(--shadow)}
    .type-card.selected{border:2px solid var(--purple)}
    .character-frame{width:min(100%,144px);aspect-ratio:4/3;margin:0 auto 10px;display:grid;place-items:center;overflow:hidden;border-radius:16px;background:linear-gradient(145deg,#f5e8fb,#fff5f9)}
    .character-art{width:100%;height:auto;display:block}
    .type-code{font-size:12px;font-weight:900;letter-spacing:.1em;color:var(--purple)}
    .type-name{font-size:14px;font-weight:900;margin-top:3px}
    .type-summary{font-size:11px;line-height:1.4;color:var(--muted);margin-top:5px;min-height:31px}
    .guide-card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 7px 24px rgba(94,55,122,.04)}
    .guide-intro{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
    .guide-intro p{color:var(--muted);font-size:14px}
    .score-rule{margin-top:22px;padding-top:22px;border-top:1px solid var(--line)}
    .score-rule strong{font-size:16px}
    .score-rule p{color:var(--muted);font-size:14px;margin-top:7px}
    .score-table{margin-top:20px;display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:16px;overflow:hidden}
    .score-cell{padding:13px 10px;text-align:center;border-right:1px solid var(--line);background:#fffafe}
    .score-cell:last-child{border-right:0}
    .score-cell strong{display:block;font-size:17px;color:var(--purple-dark)}
    .score-cell span{display:block;font-size:11px;color:var(--muted);margin-top:3px}
    .axis-list{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:22px}
    .axis{border:1px solid var(--line);border-radius:16px;padding:15px 16px;background:var(--surface-soft)}
    .axis-head{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:900;font-size:14px}
    .axis-code{font-size:11px;color:var(--purple);letter-spacing:.1em}
    .axis p{font-size:12px;color:var(--muted);margin-top:5px}
    .empty-state{padding:50px 20px;text-align:center;background:var(--surface);border:1px dashed var(--line-strong);border-radius:22px;color:var(--muted)}
    .test-shell{max-width:780px;margin:0 auto}
    .test-top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}
    .test-count{font-size:13px;font-weight:900;color:var(--purple-dark)}
    .test-progress{height:8px;background:var(--purple-soft);border-radius:999px;overflow:hidden}
    .test-progress span{display:block;height:100%;background:var(--purple);border-radius:inherit;transition:width .2s ease}
    .question-card{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:clamp(24px,5vw,46px);margin-top:22px;box-shadow:var(--shadow)}
    .question-number{font-size:12px;color:var(--purple);font-weight:900;letter-spacing:.1em}
    .question-title{font-size:clamp(25px,4vw,37px);letter-spacing:-.06em;line-height:1.23;margin-top:14px}
    .question-help{font-size:13px;color:var(--muted);margin-top:13px}
    .scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:30px}
    .scale-btn{min-height:66px;border:1px solid var(--line);background:#fffafe;border-radius:16px;padding:9px 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
    .scale-btn:hover{border-color:#bd92ce}
    .scale-btn.selected{background:var(--purple);color:#fff;border-color:var(--purple);box-shadow:0 8px 18px rgba(135,85,176,.18)}
    .scale-dot{width:13px;height:13px;border:2px solid currentColor;border-radius:50%;opacity:.7}
    .scale-btn.selected .scale-dot{background:#fff;border-color:#fff}
    .scale-label{font-size:10px;line-height:1.2;text-align:center;color:inherit}
    .test-nav{display:flex;justify-content:space-between;gap:12px;margin-top:18px}
    .test-nav button{min-height:46px;padding:0 18px;border-radius:13px;font-weight:900}
    .back-btn{background:transparent;color:var(--muted);border:1px solid var(--line)}
    .next-btn{background:var(--purple);color:#fff;min-width:130px}
    .next-btn:disabled{opacity:.4;cursor:not-allowed}
    .result-hero{display:grid;grid-template-columns:minmax(0,.95fr) minmax(260px,.7fr);gap:24px;align-items:stretch}
    .result-card{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:32px;box-shadow:var(--shadow)}
    .result-code{font-size:13px;font-weight:900;letter-spacing:.13em;color:var(--purple)}
    .result-title{font-size:clamp(32px,5vw,54px);font-weight:900;letter-spacing:-.07em;line-height:1.07;margin-top:10px}
    .result-desc{font-size:16px;color:var(--muted);margin-top:14px;max-width:560px}
    .result-character{display:grid;place-items:center;min-height:260px;padding:18px;background:linear-gradient(145deg,#f3e3fa,#fff4f8)}
    .result-character .character-frame{width:min(100%,220px);margin:0}
    .result-sections{display:grid;grid-template-columns:1.05fr .95fr;gap:16px;margin-top:16px}
    .result-block{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px}
    .block-title{font-size:18px;font-weight:900;letter-spacing:-.04em}
    .block-copy{font-size:13px;color:var(--muted);margin-top:5px}
    .axis-result{margin-top:18px}
    .axis-result-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:13px;font-weight:900}
    .axis-result-head span{font-size:12px;color:var(--muted)}
    .dual-bar{display:grid;grid-template-columns:1fr 1fr;height:12px;border-radius:999px;overflow:hidden;background:var(--line);margin-top:8px}
    .dual-bar .left{background:var(--purple)}
    .dual-bar .right{background:var(--pink)}
    .dual-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:5px}
    .food-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:16px}
    .food-card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fffafe}
    .food-card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
    .food-card p{font-size:12px;font-weight:900;padding:9px 10px}
    .result-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
    .fine-print{font-size:12px;color:var(--muted-2);margin-top:20px}
    .result-dashboard{max-width:1040px;margin:0 auto}
    .result-banner{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(260px,.88fr);overflow:hidden;border:1px solid var(--line);border-radius:28px;background:linear-gradient(135deg,#fff9ff 0%,#f6e5fb 58%,#ead8f4 100%);box-shadow:var(--shadow)}
    .result-banner-copy{padding:34px 34px 30px;display:flex;flex-direction:column;justify-content:center}
    .result-status{display:inline-flex;align-items:center;width:max-content;padding:6px 12px;border-radius:999px;background:var(--purple-soft);color:var(--purple-dark);font-size:11px;font-weight:900;letter-spacing:.04em}
    .result-banner-title{font-size:clamp(30px,4.5vw,50px);line-height:1.1;letter-spacing:-.07em;margin-top:18px}
    .result-banner-title span{display:block;color:var(--purple)}
    .result-banner-code{display:flex;align-items:center;gap:12px;margin-top:20px}
    .result-banner-code strong{font-size:16px;letter-spacing:.1em;color:var(--purple)}
    .result-banner-code b{font-size:clamp(26px,4vw,42px);letter-spacing:-.06em}
    .result-banner-sub{font-size:14px;color:var(--muted);margin-top:9px}
    .result-banner-mascot{display:flex;align-items:flex-end;justify-content:center;min-height:315px;background:radial-gradient(circle at 52% 32%,rgba(255,255,255,.7),transparent 42%),linear-gradient(145deg,#ecd9f6,#f5dfe9);padding:16px 20px 0}
    .result-banner-mascot img{width:min(100%,330px);height:auto;aspect-ratio:1;object-fit:cover;display:block;border-radius:28px 28px 0 0;mix-blend-mode:multiply}
    .result-panel{margin-top:15px;background:rgba(255,253,253,.92);border:1px solid var(--line);border-radius:22px;padding:23px 25px;box-shadow:0 7px 24px rgba(94,55,122,.04)}
    .result-panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:15px}
    .result-panel-title{font-size:19px;letter-spacing:-.045em}
    .result-panel-note{font-size:11px;color:var(--muted)}
    .axis-dashboard-row{display:grid;grid-template-columns:minmax(145px,.85fr) minmax(180px,1fr) minmax(145px,.85fr);gap:15px;align-items:center;padding:12px 0;border-top:1px solid #f1e8f3}
    .axis-dashboard-row:first-of-type{border-top:0}
    .axis-dashboard-label{font-size:12px;font-weight:900}
    .axis-dashboard-label small{display:block;font-size:10px;font-weight:600;color:var(--muted);margin-top:3px}
    .axis-dashboard-label.right{text-align:right}
    .axis-dashboard-line{position:relative;padding-top:8px}
    .axis-dashboard-track{height:10px;border-radius:999px;background:#eadff0;overflow:visible}
    .axis-dashboard-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#a965c9,#8e52b3)}
    .axis-dashboard-marker{position:absolute;top:3px;width:20px;height:20px;border:3px solid #fff;border-radius:50%;background:#b875d0;box-shadow:0 2px 8px rgba(95,49,120,.22);transform:translateX(-50%)}
    .axis-dashboard-badge{position:absolute;top:-21px;transform:translateX(-50%);padding:2px 7px;border-radius:999px;background:var(--purple);color:#fff;font-size:9px;font-weight:900}
    .keyword-panel{margin-top:15px;background:rgba(255,253,253,.92);border:1px solid var(--line);border-radius:22px;padding:18px 25px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
    .keyword-title{font-size:16px;font-weight:900;letter-spacing:-.04em;white-space:nowrap}
    .keyword-list{display:flex;gap:8px;flex-wrap:wrap}
    .keyword-chip{padding:8px 13px;border-radius:999px;border:1px solid var(--line-strong);background:#fffaff;color:var(--purple-dark);font-size:12px;font-weight:800}
    .result-lower-grid{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(260px,.82fr);gap:15px;margin-top:15px}
    .result-section-heading{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
    .result-section-heading h2{font-size:18px;letter-spacing:-.04em}
    .result-section-heading p{font-size:11px;color:var(--muted)}
    .result-food-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:15px}
    .result-food-card{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:#fffafe}
    .result-food-card img{width:100%;aspect-ratio:1.25;display:block;object-fit:cover}
    .result-food-card strong{display:block;font-size:11px;padding:8px 9px 0}
    .result-food-card span{display:block;font-size:10px;color:var(--muted);padding:3px 9px 9px}
    .related-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}
    .related-card{border:1px solid var(--line);border-radius:15px;background:#fffafe;padding:9px;text-align:center}
    .related-card .character-frame{width:min(100%,100px);margin-bottom:6px;border-radius:12px}
    .related-card strong{display:block;font-size:11px}
    .related-card span{display:block;color:var(--muted);font-size:10px;margin-top:2px}
    .summary-list{display:grid;gap:13px;margin-top:16px}
    .summary-row{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center}
    .summary-mark{width:25px;height:25px;display:grid;place-items:center;border-radius:50%;background:var(--purple-soft);color:var(--purple);font-size:12px;font-weight:900}
    .summary-row strong{font-size:12px}
    .summary-row span{display:block;color:var(--muted);font-size:11px;margin-top:2px}
    .result-footer-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
    .result-footer-actions button{min-width:150px}
    .kakao-share-btn{background:#fee500;color:#3a2b00;border-color:#fee500}
    .footer{border-top:1px solid var(--line);padding:28px 0 45px;color:var(--muted);font-size:12px}
    @media (max-width:900px){
      .hero,.result-hero{grid-template-columns:1fr}
      .hero-panel{min-height:240px}
      .catalog-grid{grid-template-columns:repeat(3,1fr)}
      .result-character{min-height:220px}
    }
    @media (max-width:680px){
      .site-header{height:62px}
      .header-inner,.page{width:min(100% - 28px,560px)}
      .brand-main{font-size:14px}
      .brand-sub{font-size:9px}
      .nav-btn{display:none}
      .reset-btn{font-size:12px;padding:8px 9px}
      .page{padding:32px 0 62px}
      .hero-copy{font-size:16px}
      .hero-panel{padding:24px;min-height:220px;border-radius:24px}
      .panel-title{font-size:35px}
      .home-mascot{width:108px;right:10px;bottom:10px;border-radius:20px}
      .section{margin-top:48px}
      .section-head{display:block}
      .section-note{text-align:left;margin-top:9px}
      .metrics{grid-template-columns:repeat(2,1fr);gap:10px}
      .metric{padding:16px 15px;border-radius:16px}
      .metric-value{font-size:25px}
      .metric-label{font-size:12px}
      .feature-grid{grid-template-columns:1fr;gap:10px}
      .feature-card{min-height:156px;padding:20px;border-radius:19px}
      .feature-title{font-size:19px}
      .catalog-grid{grid-template-columns:repeat(2,1fr);gap:10px}
      .type-card{border-radius:18px;padding:9px}
      .character-frame{width:min(100%,112px);margin-bottom:7px;border-radius:12px}
      .type-code{font-size:10px}
      .type-name{font-size:12px}
      .type-summary{font-size:10px;min-height:28px}
      .guide-card{padding:20px;border-radius:20px}
      .guide-intro,.axis-list{grid-template-columns:1fr}
      .score-table{grid-template-columns:repeat(5,minmax(0,1fr))}
      .score-cell{padding:10px 3px}
      .score-cell strong{font-size:14px}
      .score-cell span{font-size:9px}
      .question-card{padding:23px 18px;border-radius:22px}
      .scale{gap:5px;margin-top:24px}
      .scale-btn{min-height:62px;border-radius:13px;padding:6px 2px}
      .scale-label{font-size:9px}
      .test-nav button{padding:0 14px}
      .result-card{padding:23px;border-radius:22px}
      .result-character{min-height:190px;padding:12px}

        <path d="M72 57c11-5 26-8 41-9 15-1 28 2 39 7" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="5" stroke-linecap="round"/>
        <circle cx="88" cy="91" r="4" fill="#493552"/><circle cx="132" cy="91" r="4" fill="#493552"/>
        <path d="M102 103c5 5 11 5 16 0" fill="none" stroke="#493552" stroke-width="3" stroke-linecap="round"/>
        <circle cx="75" cy="103" r="8" fill="${accent}" opacity=".38"/><circle cx="145" cy="103" r="8" fill="${accent}" opacity=".38"/>
        <path d="M82 132c12 6 44 6 56 0" fill="none" stroke="${accent}" stroke-width="8" stroke-linecap="round"/>
        <path d="M49 129c-9-2-16-7-21-16M171 129c9-2 16-7 21-16" fill="none" stroke="${hat}" stroke-width="10" stroke-linecap="round"/>
      </svg>`;
    }
    function typeCodes(){
      return Object.keys(TYPE_NAMES);
    }
    function typeCard(code, index){
      const selected = state.selectedType === code ? ' selected' : '';
      return `<button class="type-card${selected}" data-action="type" data-type="${code}">
        <span class="character-frame">${characterSvg(code,index)}</span>
        <span class="type-code">${code}</span>
        <span class="type-name">${TYPE_NAMES[code]}</span>
        <span class="type-summary">${TYPE_SUMMARIES[code]}</span>
      </button>`;
    }
    function typeFromScores(scores){
      const codes = scores.map(s => s.average <= 3 ? DIMENSIONS[s.dimension].left.code : DIMENSIONS[s.dimension].right.code);
      return codes.join('');
    }
    function scoreAnswers(){
      const scores = DIMENSIONS.map((_, dimension) => {
        const values = QUESTIONS.map((q,i) => q.dimension === dimension ? state.answers[i] : null).filter(v => v !== null);
        const average = values.reduce((a,b)=>a+b,0) / values.length;
        const left = Math.round((5 - average) / 4 * 100);
        const right = 100 - left;
        return {dimension,average,left,right,strength:Math.max(left,right), balanced:left===right};
      });
      const code = typeFromScores(scores);
      return {scores,code,name:TYPE_NAMES[code],summary:TYPE_SUMMARIES[code]};
    }
    function renderHome(){
      app.innerHTML = `<div class="page">
        <section class="hero">
          <div>
            <div class="eyebrow">16 food personalities</div>
            <h1>나의 미식 취향을<br>조금 더 선명하게</h1>
            <p class="hero-copy">92개의 질문에 답하면 네 가지 취향 축을 조합해 나만의 미식 퍼스널리티를 찾아드립니다.</p>
            <div class="hero-actions"><button class="primary-btn" data-action="start">검사 시작</button><button class="secondary-btn" data-action="catalog">16유형 도감 보기</button></div>

          <aside class="hero-panel"><div><div class="panel-label">FOODING CLUB PTCI</div><div class="panel-title">taste<br>has a shape.</div><div class="panel-copy">중앙은 50%, 어느 한쪽으로 갈수록 100%에 가까워집니다.</div></div><img class="home-mascot" src="assets/라벤더 푸드 탐험가 마스코트.png" alt="라벤더 푸드 탐험가 마스코트" loading="eager"><div class="panel-stat"><strong>92</strong><span>questions · 4 axes · 16 types</span></div></aside>
        </section>
        <section class="section"><div class="section-head"><div><div class="section-kicker">how it works</div><h2 class="section-title">검사 결과는 이렇게 읽어요</h2></div><p class="section-note">양쪽 성향의 비중을 함께 보여주고, 더 높은 쪽을 대표 유형으로 정합니다.</p></div>
          <div class="metrics"><div class="metric"><span class="metric-value">92</span><span class="metric-label">전체 설문 문항</span></div><div class="metric"><span class="metric-value">4</span><span class="metric-label">미식 성향 영역</span></div><div class="metric"><span class="metric-value">16</span><span class="metric-label">미식 퍼스널리티</span></div><div class="metric"><span class="metric-value">1–5</span><span class="metric-label">문항별 응답 척도</span></div></div>
        </section>
        <section class="section"><div class="section-head"><div><div class="section-kicker">explore</div><h2 class="section-title">원하는 곳부터 둘러보세요</h2></div></div>
          <div class="feature-grid"><button class="feature-card accent" data-action="start"><div><div class="feature-label">PTCI TEST</div><div class="feature-title">나의 미식 유형 찾기</div><p class="feature-copy">92문항에 답하고 유형 결과 확인하기</p></div><span class="feature-link">검사 시작</span></button><button class="feature-card" data-action="catalog"><div><div class="feature-label">TYPE LIBRARY</div><div class="feature-title">16가지 미식 캐릭터</div><p class="feature-copy">각 유형의 성격과 취향 미리보기</p></div><span class="feature-link">도감 보기</span></button><button class="feature-card" data-action="guide"><div><div class="feature-label">SCORING GUIDE</div><div class="feature-title">채점 기준 알아보기</div><p class="feature-copy">4가지 성향의 파일럿 기준 안내</p></div><span class="feature-link">기준 확인</span></button></div>
        </section>
        <section class="section"><div class="section-head"><div><div class="section-kicker">preview</div><h2 class="section-title">16가지 미식 퍼스널리티</h2></div><button class="secondary-btn" data-action="catalog">전체 도감 보기</button></div><div class="catalog-grid">${typeCodes().slice(0,4).map((c,i)=>typeCard(c,i)).join('')}</div></section>
      </div>`;
    }
    function renderCatalog(){
      app.innerHTML = `<div class="page"><section class="section" style="margin-top:0"><div class="section-head"><div><div class="section-kicker">16 food personalities</div><h1 class="section-title">16가지 미식 퍼스널리티</h1><p class="hero-copy" style="font-size:16px;margin-top:12px">네 가지 취향 차원을 조합한 파일럿 분류입니다. 캐릭터를 눌러 유형 설명을 확인하세요.</p></div><button class="primary-btn" data-action="start">검사 시작</button></div><div class="catalog-grid">${typeCodes().map((c,i)=>typeCard(c,i)).join('')}</div>${state.selectedType ? `<div class="section"><div class="guide-card"><div class="section-kicker">selected type</div><h2 class="section-title">${state.selectedType} · ${TYPE_NAMES[state.selectedType]}</h2><p class="hero-copy" style="font-size:16px;margin-top:10px">${TYPE_SUMMARIES[state.selectedType]}. 네 축의 결과는 실제 검사에서 응답 비중으로 계산됩니다.</p></div></div>`:''}</section></div>`;
    }
    function renderGuide(){
      app.innerHTML = `<div class="page"><section class="section" style="margin-top:0"><div class="section-head"><div><div class="section-kicker">scoring guide</div><h1 class="section-title">채점 기준</h1></div><button class="primary-btn" data-action="start">검사 시작</button></div><div class="guide-card"><div class="guide-intro"><div><h2 class="section-title" style="font-size:26px;margin:0">중앙 50%, 양끝 100%</h2><p style="margin-top:10px">각 축의 23개 문항 평균을 1–5점으로 계산합니다. 평균 3.0은 정확히 중립이므로 어느 쪽도 0%가 되지 않습니다.</p></div><div><h3 style="font-size:16px">결과 화면에는 양쪽을 함께 표시합니다.</h3><p style="margin-top:7px">예: E 탐험형 75% / F 친숙형 25%. 대표 유형은 더 높은 쪽의 코드로 조합하지만, 실제 결과에서는 네 축의 양쪽 비중을 모두 확인할 수 있습니다.</p></div></div><div class="score-rule"><strong>성향 강도는 양쪽 중 큰 값입니다.</strong><p>중립에서 멀어질수록 강도가 높아지고, 한쪽 끝에 가까워질수록 100%에 가까워집니다.</p></div><div class="score-table"><div class="score-cell"><strong>1.0</strong><span>한쪽 100%</span></div><div class="score-cell"><strong>2.0</strong><span>한쪽 75%</span></div><div class="score-cell"><strong>3.0</strong><span>양쪽 50%</span></div><div class="score-cell"><strong>4.0</strong><span>한쪽 75%</span></div><div class="score-cell"><strong>5.0</strong><span>한쪽 100%</span></div></div><div class="axis-list">${DIMENSIONS.map(d=>`<div class="axis"><div class="axis-head"><span>${d.left.code} ${d.left.name} / ${d.right.code} ${d.right.name}</span><span class="axis-code">${d.label}</span></div><p>평균이 3보다 낮으면 ${d.left.code}, 높으면 ${d.right.code} 쪽 비중이 커집니다.</p></div>`).join('')}</div><p class="fine-print">이 검사는 파일럿용 미식 성향 분류이며, 임상·심리 진단이 아닙니다.</p></div></section></div>`;
    }
    function renderTest(){
      const start = state.page * PER_PAGE;
      const end = Math.min(start + PER_PAGE, QUESTIONS.length);
      const pageQuestions = QUESTIONS.slice(start,end);
      const answered = pageQuestions.every((_,i)=>state.answers[start+i] !== null);
      const progress = Math.round((end / QUESTIONS.length) * 100);
      app.innerHTML = `<div class="page"><section class="test-shell" style="margin-top:0"><div class="test-top"><span class="test-count">${start+1}–${end} / ${QUESTIONS.length}</span><span class="test-count">${progress}%</span></div><div class="test-progress"><span style="width:${progress}%"></span></div><div class="question-card"><div class="question-number">QUESTION ${String(start+1).padStart(2,'0')}—${String(end).padStart(2,'0')}</div><h1 class="question-title">천천히 읽고, 지금의 나와 가까운 답을 골라주세요.</h1><p class="question-help">각 문항에서 1은 왼쪽 성향, 5는 오른쪽 성향에 가깝습니다.</p>${pageQuestions.map((q,i)=>{const chosen=state.answers[start+i];return `<div class="axis" style="margin-top:22px;background:#fffafe"><div style="font-size:15px;font-weight:900">${start+i+1}. ${q.text}</div><div class="scale" data-question="${start+i}">${[1,2,3,4,5].map(v=>`<button class="scale-btn${chosen===v?' selected':''}" data-action="answer" data-index="${start+i}" data-value="${v}" aria-label="${v}점"><span class="scale-dot"></span><span class="scale-label">${v===1?'왼쪽에 가까움':v===3?'중간':v===5?'오른쪽에 가까움':'v'+v}</span></button>`).join('')}</div></div>`}).join('')}</div><div class="test-nav"><button class="back-btn" data-action="test-back" ${state.page===0?'disabled':''}>이전</button><button class="next-btn" data-action="test-next" ${answered?'':'disabled'}>${end===QUESTIONS.length?'결과 보기':'다음 문항'}</button></div></section></div>`;
    }
    function renderResult(){
      const result = state.result || scoreAnswers();
      const primaryIndex = typeCodes().indexOf(result.code);
      app.innerHTML = `<div class="page"><section class="result-hero"><div class="result-card"><div class="result-code">YOUR FOOD PERSONALITY · ${result.code}</div><h1 class="result-title">${result.name}</h1><p class="result-desc">${result.summary}</p><div class="result-actions"><button class="primary-btn" data-action="catalog">유형 도감 보기</button><button class="secondary-btn" data-action="reset">다시 검사하기</button></div><p class="fine-print">대표 유형은 네 축에서 더 높은 쪽을 조합한 결과입니다. 아래에서 양쪽 성향의 비중을 함께 확인하세요.</p></div><div class="result-card result-character"><span class="character-frame">${characterSvg(result.code,primaryIndex)}</span></div></section><section class="result-sections"><div class="result-block"><h2 class="block-title">네 가지 취향 축</h2><p class="block-copy">중앙 50%를 기준으로 양쪽 비중을 함께 표시합니다.</p>${result.scores.map(s=>{const d=DIMENSIONS[s.dimension];return `<div class="axis-result"><div class="axis-result-head"><strong>${d.left.code} ${s.left}% <span style="color:var(--muted)">${d.left.name}</span></strong><span>${d.right.code} ${s.right}% ${d.right.name}</span></div><div class="dual-bar"><span class="left" style="width:${s.left}%"></span><span class="right" style="width:${s.right}%"></span></div><div class="dual-labels"><span>${s.balanced?'중립에 가까운 축':'대표 쪽 '+s.strength+'%'}</span><span>평균 ${s.average.toFixed(1)}</span></div></div>`}).join('')}</div><div class="result-block"><h2 class="block-title">잘 어울리는 메뉴</h2><p class="block-copy">유형의 성향을 가볍게 참고한 추천입니다.</p><div class="food-grid">${FOOD_IMAGES.map(([src,label])=>`<div class="food-card"><img src="${src}" alt="${label}" loading="lazy"><p>${label}</p></div>`).join('')}</div></div></section></div>`;
    }
    function renderResultDashboard(){
      const result = state.result || scoreAnswers();
      const primaryIndex = typeCodes().indexOf(result.code);
      const keywordPool = [
        result.code.includes('E') ? '새로운 맛' : '익숙한 맛',
        result.code.includes('M') ? '함께 나누는 식사' : '나만의 식사 리듬',
        result.code.includes('C') ? '가벼운 즉흥성' : '차분한 계획',
        result.code.includes('B') ? '진한 풍미' : '편안한 풍미'
      ];
      const related = typeCodes().filter(code => code !== result.code).slice(0,3);
      const foodDescriptions = ['허브 향이 도는 편안한 한 끼','라벤더와 달콤한 향의 디저트','바질 향이 살아 있는 파스타','따뜻하고 부드러운 향의 음료'];
      app.innerHTML = `<div class="page"><div class="result-dashboard">
        <section class="result-banner"><div class="result-banner-copy"><span class="result-status">PTCI Food MBTI 결과</span><h1 class="result-banner-title">검사 완료!<span>당신의 미식 퍼스널리티는</span></h1><div class="result-banner-code"><strong>${result.code}</strong><b>${result.name}</b></div><p class="result-banner-sub">${result.summary}</p></div><div class="result-banner-mascot"><img src="assets/라벤더 푸드 탐험가 마스코트.png" alt="라벤더 푸드 탐험가 마스코트"></div></section>
        <section class="result-panel"><div class="result-panel-head"><h2 class="result-panel-title">나의 미식 성향 분석</h2><span class="result-panel-note">4가지 축으로 살펴본 당신의 미식 성향이에요.</span></div>${result.scores.map(s=>{const d=DIMENSIONS[s.dimension];const marker=Math.min(96,Math.max(4,s.left));const strong=s.left>=s.right?`${d.left.code} ${d.left.name}`:`${d.right.code} ${d.right.name}`;return `<div class="axis-dashboard-row"><div class="axis-dashboard-label">${d.left.name} (${d.left.code}/${d.right.code})<small>${d.label}</small></div><div class="axis-dashboard-line"><div class="axis-dashboard-track"><div class="axis-dashboard-fill" style="width:${s.left}%"></div></div><span class="axis-dashboard-marker" style="left:${marker}%"></span><span class="axis-dashboard-badge" style="left:${marker}%">${s.strength}%</span></div><div class="axis-dashboard-label right">${d.right.name}<small>${strong} 선호</small></div></div>`}).join('')}</section>
        <section class="keyword-panel"><h2 class="keyword-title">나의 취향 키워드</h2><div class="keyword-list">${keywordPool.map(keyword=>`<span class="keyword-chip">${keyword}</span>`).join('')}</div></section>
        <div class="result-lower-grid"><section class="result-panel"><div class="result-section-heading"><h2>이런 음식과 잘 맞아요</h2><p>당신의 미식 성향과 특성 잘 어울리는 음식들이에요.</p></div><div class="result-food-grid">${FOOD_IMAGES.map(([src,label],i)=>`<div class="result-food-card"><img src="${src}" alt="${label}" loading="lazy"><strong>${label}</strong><span>${foodDescriptions[i]}</span></div>`).join('')}</div></section><section class="result-panel"><div class="result-section-heading"><h2>설문 응답 요약</h2><p>이번 결과의 기준</p></div><div class="summary-list"><div class="summary-row"><span class="summary-mark">01</span><div><strong>총 ${QUESTIONS.length}문항 완료</strong><span>네 가지 취향 축을 모두 분석했어요.</span></div></div><div class="summary-row"><span class="summary-mark">04</span><div><strong>4가지 성향 축 분석</strong><span>양쪽 비중을 함께 표시했어요.</span></div></div><div class="summary-row"><span class="summary-mark">TYPE</span><div><strong>대표 유형 ${result.code}</strong><span>${result.name}</span></div></div><div class="summary-row"><span class="summary-mark">SAVE</span><div><strong>결과 저장 가능</strong><span>브라우저에 결과를 저장할 수 있어요.</span></div></div></div></section></div>
        <section class="result-panel"><div class="result-section-heading"><h2>잘 맞는 유형</h2><p>당신과 미식 취향이 잘 통하는 유형이에요.</p></div><div class="related-grid">${related.map((code,i)=>`<button class="related-card" data-action="type" data-type="${code}"><span class="character-frame">${characterSvg(code,i+5)}</span><strong>${TYPE_NAMES[code]}</strong><span>${code}</span></button>`).join('')}</div></section>
        <div class="result-footer-actions"><button class="primary-btn" data-action="save-result">결과 저장</button><button class="primary-btn kakao-share-btn" data-action="kakao-share">카카오톡 공유</button><button class="secondary-btn" data-action="catalog">다른 유형 보기</button></div>
      </div></div>`;
    }
    function render(){
      if(state.view==='home') renderHome();
      else if(state.view==='catalog') renderCatalog();
      else if(state.view==='guide') renderGuide();
      else if(state.view==='test') renderTest();
      else if(state.view==='result') renderResultDashboard();
      window.scrollTo({top:0,behavior:'instant'});
    }
    function resetTest(){state.view='home';state.answers=Array(QUESTIONS.length).fill(null);state.page=0;state.result=null;state.selectedType=null;render()}
    document.body.addEventListener('click', event => {
      const target = event.target.closest('[data-action]');
      if(!target) return;
      const action = target.dataset.action;
      if(action==='home'){event.preventDefault();state.view='home';render();return}
      if(action==='reset'){resetTest();return}
      if(action==='start'){state.view='test';state.page=0;render();return}
      if(action==='catalog'){state.view='catalog';render();return}
      if(action==='guide'){state.view='guide';render();return}
      if(action==='save-result'){saveResult();return}
      if(action==='kakao-share'){shareToKakao();return}
      if(action==='type'){state.selectedType=target.dataset.type;render();return}
      if(action==='answer'){state.answers[Number(target.dataset.index)] = Number(target.dataset.value);renderTest();return}
      if(action==='test-back'){if(state.page>0){state.page--;render();}return}
      if(action==='test-next'){const start=state.page*PER_PAGE;const end=Math.min(start+PER_PAGE,QUESTIONS.length);if(!Array.from({length:end-start},(_,i)=>state.answers[start+i]).every(v=>v!==null))return;if(end===QUESTIONS.length){state.result=scoreAnswers();state.view='result';}else state.page++;render();return}
    });
    render();
  </script>
